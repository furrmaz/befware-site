<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sayfa bulunamadı | Befware</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
  body{margin:0;min-height:100vh;display:grid;place-items:center;text-align:center;font-family:"Segoe UI",Inter,system-ui,-apple-system,Helvetica,Arial,sans-serif;color:#fff;background:radial-gradient(700px 400px at 80% 0%,rgba(37,99,235,.55),transparent 70%),#050B1F;padding:20px}
  img{height:36px;margin:0 auto 40px;display:block}
  h1{font-size:clamp(70px,14vw,140px);margin:0;line-height:1;letter-spacing:-4px;background:linear-gradient(90deg,#7DD3FC,#818CF8);-webkit-background-clip:text;background-clip:text;color:transparent}
  p{color:#A5B4CB;font-size:18px;margin:16px 0 32px}
  a.btn{display:inline-block;background:#2563EB;color:#fff;text-decoration:none;font-weight:700;padding:13px 24px;border-radius:12px;box-shadow:0 10px 28px rgba(37,99,235,.45)}
</style>
</head>
<body>
  <main>
    <img src="/logo-beyaz.svg" alt="Befware">
    <h1>404</h1>
    <p>Aradığınız sayfa taşınmış ya da hiç var olmamış olabilir.</p>
    <a class="btn" href="/">Ana sayfaya dön</a>
  </main>

</html>
